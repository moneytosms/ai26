name: AI26 regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --directory backend
      - name: Backend regressions without ML downloads
        run: uv run --frozen --directory backend python -m unittest discover -s ../tests -v
        env:
          AI26_PROCESSING_ENABLED: "0"
      - name: Evaluation fixture
        run: python evaluation/evaluate.py --records evaluation/example.jsonl --output evaluation/results/fixture.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
